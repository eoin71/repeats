<div class="bg-accent-50 dark:bg-accent-900/20 border border-accent-200 dark:border-accent-800 rounded-lg shadow-sm p-4"
     id="countdown-{{ countdown.id }}">
    <div class="flex items-center justify-between gap-4">
        <h3 class="text-lg font-medium text-neutral-800 dark:text-neutral-100">{{ countdown.title }}</h3>
        <div class="flex items-center gap-3 flex-shrink-0">
            {% set days = countdown.days_remaining() %}
            {% if days > 0 %}
            <span class="text-2xl font-bold text-accent-600 dark:text-accent-400">{{ days }}</span>
            <span class="text-sm text-neutral-500 dark:text-neutral-400">day{% if days != 1 %}s{% endif %}</span>
            {% elif days == 0 %}
            <span class="text-lg font-bold text-secondary-600 dark:text-secondary-400">today</span>
            {% else %}
            <span class="text-lg font-bold text-neutral-400 dark:text-neutral-500">{{ days|abs }} day{% if days|abs != 1 %}s{% endif %} ago</span>
            {% endif %}
            <button hx-delete="/countdowns/{{ countdown.id }}"
                    hx-target="#countdown-{{ countdown.id }}"
                    hx-swap="outerHTML swap:0.3s"
                    hx-confirm="Delete this countdown?"
                    class="text-danger-500 hover:text-danger-700 dark:text-danger-400 dark:hover:text-danger-300 transition duration-150 p-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>
    </div>
</div>
